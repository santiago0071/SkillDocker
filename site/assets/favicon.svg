<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#07080d" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="ufoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <radialGradient id="beamGrad" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Orbit Ring -->
  <ellipse cx="256" cy="270" rx="170" ry="60" fill="none" stroke="url(#ringGrad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Tractor Beam -->
  <polygon points="210,260 302,260 340,410 172,410" fill="url(#beamGrad)" />

  <!-- UFO Cabin (Glass Dome) -->
  <ellipse cx="256" cy="210" rx="60" ry="48" fill="#38bdf8" fill-opacity="0.9" filter="url(#glow)" />
  <ellipse cx="256" cy="205" rx="42" ry="28" fill="#e0f2fe" fill-opacity="0.9" />

  <!-- UFO Saucer Body -->
  <ellipse cx="256" cy="245" rx="140" ry="38" fill="url(#ufoGrad)" stroke="#a5b4fc" stroke-width="3" filter="url(#glow)" />

  <!-- Saucer Lights -->
  <circle cx="160" cy="252" r="7" fill="#f43f5e" />
  <circle cx="205" cy="258" r="7" fill="#fbbf24" />
  <circle cx="256" cy="260" r="8" fill="#34d399" />
  <circle cx="307" cy="258" r="7" fill="#fbbf24" />
  <circle cx="352" cy="252" r="7" fill="#f43f5e" />

  <!-- Docking Core Node -->
  <circle cx="256" cy="380" r="16" fill="#a855f7" filter="url(#glow)" />
  <circle cx="256" cy="380" r="8" fill="#ffffff" />
</svg>
